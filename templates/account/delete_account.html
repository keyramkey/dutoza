{% extends "base.html" %}
{% block content %}
<style>
.delete-wrap {
    max-width: 480px;
    margin: 16px auto 100px;
    padding: 0 14px;
}
.delete-card {
    background: #fff;
    border-radius: 16px;
    padding: 22px 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    border: 1px solid #fdecea;
}
.delete-card h2 {
    margin: 0 0 8px;
    font-size: 20px;
    color: #b71c1c;
    display: flex;
    align-items: center;
    gap: 10px;
}
.delete-card .warn {
    font-size: 13px;
    color: #65676b;
    line-height: 1.5;
    margin-bottom: 16px;
    background: #fff5f5;
    border-left: 3px solid #e41e3f;
    padding: 12px 14px;
    border-radius: 0 10px 10px 0;
}
.delete-card .warn ul {
    margin: 8px 0 0 18px;
    padding: 0;
}
.delete-card label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #050505;
    margin-bottom: 6px;
}
.delete-card input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e4e6eb;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 14px;
    box-sizing: border-box;
    outline: none;
}
.delete-card input:focus {
    border-color: #e41e3f;
    box-shadow: 0 0 0 3px rgba(228,30,63,0.12);
}
.delete-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
}
.btn-cancel-del {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #e4e6eb;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    color: #050505;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.btn-do-del {
    flex: 1.3;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #e41e3f;
    color: #fff;
    font-weight: 800;
    cursor: pointer;
    font-size: 14px;
}
.btn-do-del:active { transform: scale(0.98); }
</style>

<div class="delete-wrap">
    <div class="delete-card">
        <h2><i class="fa-solid fa-triangle-exclamation"></i> Futa Akaunti</h2>
        <div class="warn">
            <strong>Hii haiwezi kurejeshwa.</strong>
            <ul>
                <li>Posts, comments, likes</li>
                <li>Messages, follows, status</li>
                <li>Profile, media na data zote</li>
            </ul>
        </div>

        <form method="POST" action="{{ url_for('delete_account') }}"
              onsubmit="return confirm('Una uhakika? Akaunti itafutwa KABISA na haiwezi kurejeshwa.');">

            <label for="username_confirm">Andika username yako: <strong>@{{ user.username }}</strong></label>
            <input type="text" id="username_confirm" name="username_confirm"
                   placeholder="{{ user.username }}" required autocomplete="off">

            {% if not is_google %}
            <label for="password">Nenosiri lako</label>
            <input type="password" id="password" name="password"
                   placeholder="Andika nenosiri" required autocomplete="current-password">
            {% endif %}

            <label for="confirm">Andika neno <strong>FUTA</strong> ili kuthibitisha</label>
            <input type="text" id="confirm" name="confirm"
                   placeholder="FUTA" required autocomplete="off">

            <div class="delete-actions">
                <a class="btn-cancel-del" href="{{ url_for('settings') }}">Ghairi</a>
                <button type="submit" class="btn-do-del">
                    <i class="fa-solid fa-trash"></i> Futa Kabisa
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
