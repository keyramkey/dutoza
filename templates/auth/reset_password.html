<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weka Nenosiri Jipya - Kijiji Tanzania</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #1EB53A 0%, #00A3DD 50%, #FCD116 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }
        .box {
            background: #fff; padding: 28px 25px; border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); width: 100%; max-width: 400px;
            text-align: center; border-top: 5px solid #1EB53A;
        }
        h1 { color: #1EB53A; font-size: 22px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%; padding: 12px; border: 1.5px solid #ccd0d5;
            border-radius: 8px; font-size: 14px; margin-bottom: 12px;
        }
        button {
            width: 100%; background: #1EB53A; color: white; border: none;
            padding: 13px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .flash { background: #ffebee; color: #c62828; padding: 8px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
    </style>
</head>
<body>
<div class="box">
    <h1>Weka Nenosiri Jipya</h1>
    <p>Chagua nenosiri jipya la angalau herufi 6</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
        <input type="password" name="password" placeholder="Nenosiri jipya" required minlength="6">
        <input type="password" name="confirm_password" placeholder="Thibitisha nenosiri" required minlength="6">
        <button type="submit">Badilisha Nenosiri</button>
    </form>
</div>
</body>
</html>
