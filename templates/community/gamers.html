{% extends "base.html" %}
{% block content %}
<style>
.community-wrap{max-width:800px;margin:auto;padding:16px 14px 30px}
.community-wrap a{color:#1EB53A;text-decoration:none;font-weight:600}
h1{color:#1EB53A;margin:12px 0 8px;font-size:22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tabs a{padding:10px 14px;background:#f1f5f2;border-radius:20px;font-size:13px;font-weight:600;color:#333;text-decoration:none}
.tabs a:hover,.tabs a.active{background:#1EB53A;color:#fff}
.info{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-top:10px}
.info p{color:#555;font-size:14px;line-height:1.5;margin:0}
</style>
<div class="community-wrap">
    <a href="/community">← Community</a>
    <h1>🎮 Gamers</h1>
    <div class="tabs">
        <a href="/community/gamers/all" class="{% if sub=='all' %}active{% endif %}">All</a>
        <a href="/community/gamers/adventure" class="{% if sub=='adventure' %}active{% endif %}">Adventure</a>
        <a href="/community/gamers/action" class="{% if sub=='action' %}active{% endif %}">Action</a>
        <a href="/community/gamers/racing" class="{% if sub=='racing' %}active{% endif %}">Racing</a>
        <a href="/community/gamers/sports" class="{% if sub=='sports' %}active{% endif %}">Sports</a>
        <a href="/community/gamers/strategy" class="{% if sub=='strategy' %}active{% endif %}">Strategy</a>
        <a href="/community/gamers/fighting" class="{% if sub=='fighting' %}active{% endif %}">Fighting</a>
    </div>
    <div class="info">
        <p>Sehemu ya wapenda games. Share tips, screenshots, videos na majadiliano. Genre: <strong>{{ sub or 'all' }}</strong></p>
        <p style="margin-top:12px"><a href="/community/find-group">🔎 Tafuta / unda group la gamers →</a></p>
    </div>
</div>
{% endblock %}
