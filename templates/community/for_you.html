{% extends "base.html" %}
{% block content %}
<style>
.community-wrap{max-width:800px;margin:auto;padding:16px 14px 30px}
.community-wrap a{color:#1EB53A;text-decoration:none;font-weight:600}
h1{color:#1EB53A;margin:12px 0 8px;font-size:22px}
.info{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-top:10px}
.info p{color:#555;font-size:14px;line-height:1.5;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.grid a{display:block;padding:16px;background:#f1f5f2;border-radius:12px;text-align:center;color:#222;text-decoration:none;font-weight:600;font-size:14px}
.grid a:hover{background:#1EB53A;color:#fff}
</style>
<div class="community-wrap">
    <a href="/community">← Community</a>
    <h1>✨ For You</h1>
    <div class="info">
        <p>Community zinazopendekezwa kwako. Anza na hizi:</p>
        <div class="grid">
            <a href="/community/university">🎓 University</a>
            <a href="/community/gamers">🎮 Gamers</a>
            <a href="/community/friend-zone">👥 Friend Zone</a>
            <a href="/community/find-group">🔎 Find Group</a>
        </div>
    </div>
</div>
{% endblock %}
