<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; padding-bottom: 40px; }
        .topbar {
            background: #1EB53A; color: white; padding: 14px 18px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .topbar h1 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
        .topbar a { color: white; text-decoration: none; font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 6px; }
        .container { max-width: 600px; margin: 16px auto; padding: 0 12px; }
        .flash-msg { background: #e7f3ff; color: #1EB53A; padding: 10px; border-radius: 8px; margin-bottom: 14px; text-align: center; font-size: 14px; border: 1px solid #b6d4fe; }
        .card {
            background: #fff; border-radius: 12px; padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        textarea {
            width: 100%; border: 1px solid #ccd0d5; border-radius: 8px; padding: 12px;
            resize: vertical; outline: none; font-size: 14px; min-height: 100px;
        }
        textarea:focus { border-color: #1EB53A; }
        .file-label {
            display: inline-flex; align-items: center; gap: 8px;
            color: #1EB53A; font-weight: 600; font-size: 13px; cursor: pointer; margin: 12px 0;
        }
        .btn-primary {
            background: #1EB53A; color: white; border: none; padding: 12px 24px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; width: 100%;
        }
        .btn-primary:hover { background: #189a32; }
    </style>
</head>
<body>
<div class="topbar">
    <h1><i class="fa-solid fa-bullhorn"></i> Tuma Taarifa (Broadcast)</h1>
    <a href="{{ url_for('admin_dashboard') }}"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
</div>

<div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash-msg">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card">
        <form action="/admin/broadcast" method="POST" enctype="multipart/form-data">
            <textarea name="announcement" rows="4" placeholder="Andika taarifa utakayotuma kwa watumiaji wote..."></textarea>
            <label class="file-label">
                <i class="fa-solid fa-image"></i> Weka picha (si lazima)
                <input type="file" name="broadcast_image" accept="image/*" style="display:none;"
                       onchange="document.getElementById('bcImgName').textContent = this.files[0] ? this.files[0].name : '';">
            </label>
            <span id="bcImgName" style="font-size:12px;color:#65676b;display:block;margin-bottom:12px;"></span>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-paper-plane"></i> Tuma Tangazo
            </button>
        </form>
    </div>
</div>
</body>
</html>
