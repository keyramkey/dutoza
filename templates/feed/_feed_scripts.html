document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.custom-video-player').forEach(player => {
        const video = player.querySelector('video');
        const postId = player.id.replace('player-', '');

        const handleUserInteraction = () => {
            resetControlsTimeout(player);
        };

        player.addEventListener('mousemove', handleUserInteraction);
        player.addEventListener('touchstart', handleUserInteraction, { passive: true });
        player.addEventListener('mouseleave', () => {
            if (video && !video.paused) {
                player.classList.add('hide-controls');
            }
        });

        video.addEventListener('timeupdate', () => {
            const progress = document.getElementById(`progress-${postId}`);
            const timeDisplay = document.getElementById(`time-${postId}`);
            if (video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                if (progress) progress.style.width = percent + '%';
                if (timeDisplay) timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
            }
        });

        video.addEventListener('ended', () => {
            player.classList.remove('playing');
            player.classList.remove('hide-controls');
            const icon = document.getElementById(`play-icon-${postId}`);
            if (icon) icon.className = 'fa-solid fa-play';
        });

        // Single click/tap on video = play/pause only (no seek / no double-tap like)
        video.addEventListener('click', function(e) {
            if (e.target !== video) return;
            e.preventDefault();
            e.stopPropagation();
            if (typeof togglePlay === 'function') togglePlay(postId);
        });

    });
});

/* ===== FEED SCROLL AUTOPLAY ===== */
document.addEventListener('DOMContentLoaded', () => {
    const players = document.querySelectorAll('.custom-video-player');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const player = entry.target;
            const video = player.querySelector('video');
            if (!video) return;
            const postId = player.id.replace('player-', '');
            const playIcon = document.getElementById(`play-icon-${postId}`);

            if (document.getElementById('reels-viewer').classList.contains('active')) return;
            // Usicheze feed video wakati status viewer iko wazi
            var sv = document.getElementById('statusViewer');
            if (sv && sv.classList.contains('show')) return;

            if (entry.isIntersecting && entry.intersectionRatio >= 0.70) {
                pauseAllVideosExcept(video);
                video.play().catch(() => {});
                player.classList.add('playing');
                if (playIcon) playIcon.className = 'fa-solid fa-pause';
                resetControlsTimeout(player);
            } else if (entry.intersectionRatio < 0.30) {
                video.pause();
                player.classList.remove('playing');
                player.classList.remove('hide-controls');
                if (playIcon) playIcon.className = 'fa-solid fa-play';
            }
        });
    }, {
        threshold: [0, 0.30, 0.70, 1]
    });

    players.forEach(player => observer.observe(player));
});

/* ===== SEE MORE – SAFI (1 → 15 → full) ===== */
(function(){
  // Inject CSS kijani — inashinda styles zote za zamani / cache
  if (!document.getElementById('wlp-see-more-green')) {
    var st = document.createElement('style');
    st.id = 'wlp-see-more-green';
    st.textContent = '.wlp-more-btn,button.wlp-more-btn{color:#1EB53A!important;background:transparent!important;border:none!important;font-weight:700!important;font-size:13px!important;padding:2px 0!important;cursor:pointer!important;box-shadow:none!important;}.wlp-more-btn:hover{color:#15803d!important;text-decoration:underline!important;}';
    document.head.appendChild(st);
  }
  function cleanExpandable(el) {
    if (!el) return;
    el.dataset.wlpReady = '';
    el.dataset.wlpStage = '';
    el.classList.remove('wlp-expandable', 'wlp-stage-0', 'wlp-stage-1', 'wlp-stage-2');
    // remove inline clamp styles that break stages
    el.style.removeProperty('display');
    el.style.removeProperty('-webkit-box-orient');
    el.style.removeProperty('-webkit-line-clamp');
    el.style.removeProperty('max-height');
    el.style.removeProperty('overflow');
    el.style.removeProperty('overflow-y');
    var n = el.nextElementSibling;
    while (n && (n.classList.contains('wlp-more-wrap') || n.classList.contains('wlp-more-btn'))) {
      var rm = n;
      n = n.nextElementSibling;
      rm.remove();
    }
  }

  function makeExpandable(el, force) {
    if (!el) return;
    if (el.dataset.wlpReady === '1' && !force) return;

    cleanExpandable(el);

    var raw = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if (!raw) return;

    // Only if truly long (more than ~1 line)
    var longByChars = raw.length > 50;
    // force layout check
    var needs = longByChars;
    if (!needs) {
      // temporary measure height
      var prev = el.style.cssText;
      el.style.display = 'block';
      el.style.webkitLineClamp = 'unset';
      el.style.maxHeight = 'none';
      var fullH = el.scrollHeight;
      var lh = parseFloat(getComputedStyle(el).lineHeight) || 20;
      el.style.cssText = prev;
      if (fullH > lh * 1.6) needs = true;
    }
    if (!needs) return;

    el.dataset.wlpReady = '1';
    el.dataset.wlpStage = '0';
    el.classList.add('wlp-expandable', 'wlp-stage-0');
    el.style.display = '-webkit-box';
    el.style.webkitBoxOrient = 'vertical';
    el.style.webkitLineClamp = '1';
    el.style.overflow = 'hidden';
    el.style.maxHeight = '1.45em';
    el.style.whiteSpace = 'normal';

    var wrap = document.createElement('div');
    wrap.className = 'wlp-more-wrap';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'wlp-more-btn';
    btn.textContent = (window.FEED_I18N && FEED_I18N.see_more) || 'See more';
    btn.setAttribute('aria-expanded', 'false');
    // Rangi kijani — inline ili isishindwe na CSS nyingine / cache
    btn.style.cssText = 'color:#1EB53A!important;background:transparent!important;border:none!important;font-weight:700!important;font-size:13px!important;padding:2px 0!important;cursor:pointer!important;display:inline-flex!important;align-items:center!important;box-shadow:none!important;';

    function applyStage(stage) {
      el.classList.remove('wlp-stage-0', 'wlp-stage-1', 'wlp-stage-2');
      el.dataset.wlpStage = String(stage);
      // Inline backup – WebView/Android sometimes ignores line-clamp CSS alone
      if (stage === 0) {
        el.classList.add('wlp-stage-0');
        el.style.display = '-webkit-box';
        el.style.webkitBoxOrient = 'vertical';
        el.style.webkitLineClamp = '1';
        el.style.overflow = 'hidden';
        el.style.maxHeight = '1.45em';
        el.style.whiteSpace = 'normal';
        btn.textContent = (window.FEED_I18N && FEED_I18N.see_more) || 'See more';
        btn.setAttribute('aria-expanded', 'false');
        btn.style.color = '#1EB53A';
      } else if (stage === 1) {
        el.classList.add('wlp-stage-1');
        el.style.display = '-webkit-box';
        el.style.webkitBoxOrient = 'vertical';
        el.style.webkitLineClamp = '15';
        el.style.overflow = 'hidden';
        el.style.maxHeight = 'none';
        el.style.whiteSpace = 'normal';
        btn.textContent = (window.FEED_I18N && FEED_I18N.see_more) || 'See more';
        btn.setAttribute('aria-expanded', 'false');
        btn.style.color = '#1EB53A';
      } else {
        el.classList.add('wlp-stage-2');
        el.style.display = 'block';
        el.style.webkitLineClamp = 'unset';
        el.style.overflow = 'visible';
        el.style.maxHeight = 'none';
        el.style.whiteSpace = 'pre-wrap';
        btn.textContent = (window.FEED_I18N && FEED_I18N.see_less) || 'See less';
        btn.setAttribute('aria-expanded', 'true');
        btn.style.color = '#1EB53A';
      }
    }

    // Start at stage 0 (1 line)
    applyStage(0);

    var advance = function(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      var stage = Number(el.dataset.wlpStage || 0);
      if (stage === 0) applyStage(1);
      else if (stage === 1) applyStage(2);
      else applyStage(0);
    };

    btn.addEventListener('click', advance, { passive: false });
    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      e.stopPropagation();
      advance(e);
    }, { passive: false });

    wrap.appendChild(btn);
    el.insertAdjacentElement('afterend', wrap);
  }

  window.__wlpMakeExpandable = makeExpandable;
  // Re-linkify hashtags after expand stages (innerHTML can wipe links)
  var _origMake = makeExpandable;
  window.__wlpMakeExpandable = function(el, force) {
    _origMake(el, force);
    setTimeout(function(){
      if (typeof window.__kijijiLinkifyHashtags === 'function') window.__kijijiLinkifyHashtags();
    }, 20);
  };

  window.__wlpCleanExpandable = cleanExpandable;

  function scan() {
    document.querySelectorAll('.post-content').forEach(function(el) {
      makeExpandable(el);
    });
    document.querySelectorAll('.comment-item p, .reply-item p').forEach(function(el) {
      var t = (el.textContent || '').trim();
      if (t.length > 40) makeExpandable(el);
    });
    // captions in overlays if present
    document.querySelectorAll('.img-full-caption, .vda-caption, .reel-caption').forEach(function(el) {
      var t = (el.textContent || '').trim();
      if (t.length > 50) makeExpandable(el);
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    scan();
    var observer = new MutationObserver(function() {
      scan();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  });
})();

<script type="application/json" id="pendingShareData">{{ pending_share|tojson if pending_share is defined and pending_share else 'null' }}</script>
<script>
(function applyPendingShare() {
  function run() {
    var el = document.getElementById('pendingShareData');
    if (!el) return;
    var data = null;
    try { data = JSON.parse(el.textContent || 'null'); } catch (e) { return; }
    if (!data) return;

    var form = document.getElementById('createPostForm');
    if (!form) return;

    var ta = form.querySelector('textarea[name="content"]');
    if (ta && data.content) {
      ta.value = data.content;
    }

    var files = data.files || [];
    if (files.length > 0 && files[0] && files[0].filename) {
      var fname = files[0].filename;
      var mtype = files[0].media_type || 'image';
      var hidden = document.getElementById('shared_file');
      if (hidden) hidden.value = fname;

      var previewBox = document.getElementById('media-preview');
      var previewContent = document.getElementById('media-preview-content');
      if (previewBox && previewContent) {
        previewContent.innerHTML = '';
        var src = '/static/uploads/' + encodeURIComponent(fname);
        if (mtype === 'video') {
          var v = document.createElement('video');
          v.src = src;
          v.controls = true;
          v.muted = true;
          v.playsInline = true;
          previewContent.appendChild(v);
        } else {
          var img = document.createElement('img');
          img.src = src;
          img.alt = 'Shared';
          previewContent.appendChild(img);
        }
        previewBox.classList.add('show');
      }

      fetch(src).then(function(r) { return r.blob(); }).then(function(blob) {
        try {
          var file = new File([blob], fname, { type: blob.type || (mtype === 'video' ? 'video/mp4' : 'image/jpeg') });
          if (typeof assignFileToForm === 'function') assignFileToForm(file);
        } catch (e) {}
      }).catch(function(){});
    }

    try {
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (ta) ta.focus();
    } catch (e) {}
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>

<script>

/* ===== FEED VIDEO: tulia 2s → play + mute; touch → arena ===== */
(function(){
  var dwellTimers = new WeakMap();
  var DWELL_MS = 2000;

  function pauseAllFeedThumbs(except) {
    document.querySelectorAll('.feed-video-card').forEach(function(card) {
      var v = card.querySelector('video.feed-video-thumb');
      if (!v || v === except) return;
      try { v.pause(); } catch(e){}
      card.classList.remove('is-playing');
    });
  }


window.toggleFeedVideoPlay = function(postId) {
  var card = document.querySelector('.feed-video-card[data-post-id="'+postId+'"]') || document.getElementById('player-'+postId);
  if (!card) return;
  var v = card.querySelector('video.feed-video-thumb');
  if (!v) return;
  var icon = card.querySelector('.feed-video-play i');
  if (v.paused) {
    document.querySelectorAll('.feed-video-card').forEach(function(c) {
      if (c === card) return;
      var ov = c.querySelector('video.feed-video-thumb');
      if (ov) try { ov.pause(); } catch(e){}
      c.classList.remove('is-playing');
      var oi = c.querySelector('.feed-video-play i');
      if (oi) oi.className = 'fa-solid fa-play';
    });
    v.play().then(function(){
      card.classList.add('is-playing');
      if (icon) icon.className = 'fa-solid fa-pause';
    }).catch(function(){});
  } else {
    v.pause();
    card.classList.remove('is-playing');
    if (icon) icon.className = 'fa-solid fa-play';
  }
};
window.toggleFeedVideoMute = function(btn, postId) {
    var card = (btn && btn.closest) ? btn.closest('.feed-video-card') : null;
    if (!card) card = document.querySelector('.feed-video-card[data-post-id="'+postId+'"]');
    if (!card) return;
    var v = card.querySelector('video.feed-video-thumb');
    if (!v) return;
    v.muted = !v.muted;
    var icon = btn ? btn.querySelector('i') : card.querySelector('.feed-video-mute i');
    if (icon) icon.className = v.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
  };

  function startDwell(card) {
    clearDwell(card);
    var t = setTimeout(function() {
      var arena = document.getElementById('video-detail-arena');
      if (arena && arena.classList.contains('active')) return;
      var sv = document.getElementById('statusViewer');
      if (sv && sv.classList.contains('show')) return;
      var v = card.querySelector('video.feed-video-thumb');
      if (!v) return;
      pauseAllFeedThumbs(v);
      v.muted = true;
      v.play().then(function(){
        card.classList.add('is-playing');
        var muteIcon = card.querySelector('.feed-video-mute i');
        if (muteIcon) muteIcon.className = 'fa-solid fa-volume-xmark';
        var playIcon = card.querySelector('.feed-video-play i');
        if (playIcon) playIcon.className = 'fa-solid fa-pause';
      }).catch(function(){});
    }, DWELL_MS);
    dwellTimers.set(card, t);
  }

  function clearDwell(card) {
    var t = dwellTimers.get(card);
    if (t) clearTimeout(t);
    dwellTimers.delete(card);
  }

  function setup() {
    var cards = document.querySelectorAll('.feed-video-card');
    if (!cards.length) return;
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        var card = entry.target;
        if (entry.isIntersecting && entry.intersectionRatio >= 0.55) {
          startDwell(card);
        } else {
          clearDwell(card);
          var v = card.querySelector('video.feed-video-thumb');
          if (v) { try { v.pause(); } catch(e){} }
          card.classList.remove('is-playing');
          var pi = card.querySelector('.feed-video-play i');
          if (pi) pi.className = 'fa-solid fa-play';
        }
      });
    }, { threshold: [0, 0.55, 0.8] });
    cards.forEach(function(c){ obs.observe(c); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setup);
  else setup();
})();

<script>
/* ===== HASHTAG LINKIFY ===== */
(function() {
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function linkifyHashtagsInElement(el) {
    if (!el) return;
    if (el.querySelector && el.querySelector('a.hashtag-link')) return;
    var raw = el.textContent || '';
    if (!raw || raw.indexOf('#') === -1) return;
    var html = escapeHtml(raw).replace(
      /#([A-Za-z0-9_\u00C0-\u024F\u0400-\u04FF]{1,60})/g,
      function(match, tag) {
        return '<a class="hashtag-link" href="/hashtag/' + encodeURIComponent(tag) + '">#' + tag + '</a>';
      }
    );
    if (html.indexOf('hashtag-link') !== -1) {
      el.innerHTML = html;
    }
  }
  function scanHashtags() {
    document.querySelectorAll('.post-content').forEach(linkifyHashtagsInElement);
    document.querySelectorAll('.img-full-caption, .vda-caption, .reel-caption, .post-content-text').forEach(linkifyHashtagsInElement);
  }
  window.__kijijiLinkifyHashtags = scanHashtags;
  function boot() {
    scanHashtags();
    setTimeout(scanHashtags, 200);
    setTimeout(scanHashtags, 800);
    setTimeout(scanHashtags, 2000);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
  try {
    var obs = new MutationObserver(function() {
      clearTimeout(window.__htScanT);
      window.__htScanT = setTimeout(scanHashtags, 150);
    });
    obs.observe(document.body, { childList: true, subtree: true });
  } catch (e) {}
})();
</script>

<script>
/* Linkup mode: bottom/top nav profile links → Linkup page */
(function () {
  var linkupUrl = {{ identity_url|tojson }};
  var myUser = {{ (identity_username or session.get('username') or '')|tojson }};
  function isOwnProfileHref(href) {
    if (!href) return false;
    try {
      var path = href.split('?')[0];
      var m = path.match(/\/profile\/([^\/#]+)/);
      if (!m) return false;
      var u = decodeURIComponent(m[1]);
      return !myUser || u.toLowerCase() === String(myUser).toLowerCase();
    } catch (e) { return false; }
  }
  document.querySelectorAll('a[href*="/profile/"]').forEach(function (a) {
    if (!isOwnProfileHref(a.getAttribute('href'))) return;
    // nav / header only — si majina ya watu kwenye posts
    var inNav = a.closest('.bottom-nav, .bottom-bar, nav, .navbar, .top-nav, .app-header, header, .site-header, .tab-bar');
    if (!inNav) return;
    a.setAttribute('href', linkupUrl);
    var icon = a.querySelector('i.fa-user, i.fa-solid.fa-user, i.fa-regular.fa-user');
    if (icon) {
      icon.className = 'fa-solid fa-link';
    }
    a.setAttribute('title', {{ (identity_name or 'Linkup')|tojson }});
  });
})();
</script>
{% endif %}
