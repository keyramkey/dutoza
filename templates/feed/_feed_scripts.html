<script>
/* Profile pic: Google https AU local /static/uploads/ AU letter */
function avatarSrc(pic, name) {
  if (pic && (String(pic).indexOf('http://') === 0 || String(pic).indexOf('https://') === 0)) return pic;
  if (pic) return '/static/uploads/' + pic;
  var n = encodeURIComponent(name || 'U');
  return 'https://ui-avatars.com/api/?name=' + n + '&background=random&color=fff&size=128&bold=true';
}
</script>
<script>
window.CURRENT_USERNAME = {{ (session.get('username') or '')|tojson }};

function switchBackToProfile() {
    fetch('/linkup/switch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ linkup_id: null })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data && data.success) {
            window.location.href = data.redirect_url || '/home';
        } else {
            alert((data && data.message) || 'Imeshindikana');
        }
    })
    .catch(function() { alert('Imeshindikana'); });
}

function setOverlayMode(on) {

    document.body.classList.toggle('overlay-open', !!on);
    document.querySelectorAll('header, nav, .navbar, .navbar-brand, .topbar, .top-bar, .top-header, .app-header, .site-header, .site-title, .brand, .logo, .page-title').forEach(function(el) {
        if (el.closest('#reels-viewer, #image-lightbox, .card, .container')) return;
        if (on) {
            if (!el.hasAttribute('data-ov-prev')) el.setAttribute('data-ov-prev', el.style.display || '');
            el.style.display = 'none';
        } else if (el.hasAttribute('data-ov-prev')) {
            el.style.display = el.getAttribute('data-ov-prev');
            el.removeAttribute('data-ov-prev');
        }
    });
    // Hide any standalone "Kijiji" title sitting above overlays
    document.querySelectorAll('h1, h2, h3, span, a, div, p, button').forEach(function(el) {
        if (el.closest('#reels-viewer, #image-lightbox, .card, script, style')) return;
        var t = (el.textContent || '').replace(/\s+/g, ' ').trim();
        if (t !== 'Kijiji') return;
        if (el.children.length > 2) return;
        if (on) {
            if (!el.hasAttribute('data-ov-kijiji')) el.setAttribute('data-ov-kijiji', el.style.display || '');
            el.style.display = 'none';
        } else if (el.hasAttribute('data-ov-kijiji')) {
            el.style.display = el.getAttribute('data-ov-kijiji');
            el.removeAttribute('data-ov-kijiji');
        }
    });
}

function bindOverlaySeeMore(el) {
    if (!el) return;
    if (typeof window.__wlpMakeExpandable === 'function') {
        window.__wlpMakeExpandable(el, true);
    }
}


function showToast(message, type = 'success') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

/* ===== STATUS ENHANCED: viewers, react, reply, hold-pause, queue ===== */
const STATUS_UPLOAD_BASE = "{{ url_for('static', filename='uploads/') }}";
let statusItems = [];
let statusIndex = 0;
let statusTimer = null;
let statusProgressTimer = null;
let statusProgressStart = 0;
let statusProgressDuration = 5000;
let statusProgressElapsed = 0;
let statusPaused = false;
const STATUS_DURATION = 30000;           // picha pekee
const STATUS_DURATION_MUSIC = 60000;    // picha + muziki
const STATUS_DURATION_VIDEO = 90000;    // video max
let statusUserQueue = [];
let statusQueuePos = -1;
let statusCurrentUserId = null;
let statusIsOwn = false;
const MY_USER_ID = {{ session.get('user_id') or 0 }};

function buildStatusQueue() {
    statusUserQueue = [];
    // others first as shown in bar
    document.querySelectorAll('.status-scroll .status-item[data-user-id]').forEach(function(el) {
        const id = parseInt(el.getAttribute('data-user-id'), 10);
        if (id && statusUserQueue.indexOf(id) === -1) statusUserQueue.push(id);
    });
    // my status at start if has status
    if ({{ 'true' if my_status_info and my_status_info.has_status else 'false' }} && MY_USER_ID) {
        if (statusUserQueue.indexOf(MY_USER_ID) === -1) statusUserQueue.unshift(MY_USER_ID);
    }
}

function onMyStatusClick() {
    const has = {{ 'true' if my_status_info and my_status_info.has_status else 'false' }};
    if (has) {
        openStatusViewer(MY_USER_ID);
    } else {
        openStatusCreate();
    }
}
document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('myStatusBtn');
    if (btn) btn.addEventListener('click', function(e) {
        if (e.target.closest('.status-add-badge')) return;
        onMyStatusClick();
    });
    // bind hold-to-pause on body after viewer exists
    bindStatusHoldPause();
    if (typeof applyRelativeTimes === 'function') applyRelativeTimes(document);
});

/** Relative time: sasa, 5m, 2h, 1d, 1w, 3mo, 1y */
function timeAgo(ts) {
    if (!ts) return '';
    var d = null;
    if (typeof ts === 'number') {
        d = new Date(ts);
    } else {
        var s = String(ts).trim().replace(' ', 'T');
        d = new Date(s);
        if (isNaN(d.getTime())) d = new Date(String(ts).replace(/-/g, '/'));
    }
    if (!d || isNaN(d.getTime())) return String(ts).slice(0, 16);
    var sec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (sec < 0) sec = 0;
    if (sec < 60) return 'sasa';
    if (sec < 3600) return Math.floor(sec / 60) + 'm';
    if (sec < 86400) return Math.floor(sec / 3600) + 'h';
    if (sec < 604800) return Math.floor(sec / 86400) + 'd';
    if (sec < 2592000) return Math.floor(sec / 604800) + 'w';
    if (sec < 31536000) return Math.floor(sec / 2592000) + 'mo';
    return Math.floor(sec / 31536000) + 'y';
}

function applyRelativeTimes(root) {
    var scope = root || document;
    scope.querySelectorAll('.rel-time[data-ts]').forEach(function(el) {
        var ts = el.getAttribute('data-ts');
        if (ts) el.textContent = timeAgo(ts);
    });
}

function openStatusCreate() {
    document.getElementById('statusCreateModal').classList.add('show');
}
function closeStatusCreate() {
    document.getElementById('statusCreateModal').classList.remove('show');
    const f = document.getElementById('statusFile');
    if (f) f.value = '';
    const p = document.getElementById('statusPreview');
    if (p) { p.innerHTML = ''; p.classList.remove('show'); }
    const n = document.getElementById('statusFileName');
    if (n) n.textContent = '';
    try {
        if (typeof _statusMusicPreview !== 'undefined' && _statusMusicPreview) {
            _statusMusicPreview.pause();
            _statusMusicPreview = null;
        }
    } catch (e) {}
}

function previewStatusFile(input) {
    const file = input.files && input.files[0];
    const preview = document.getElementById('statusPreview');
    const nameEl = document.getElementById('statusFileName');
    if (!file) return;
    const MAX_IMAGE = 24 * 1024 * 1024;
    const MAX_VIDEO = 24 * 1024 * 1024;
    if (file.type.startsWith('video/') && file.size > MAX_VIDEO) {
        alert('Video isizidi 24MB');
        input.value = '';
        return;
    }
    if (file.type.startsWith('image/') && file.size > MAX_IMAGE) {
        alert('Picha isizidi 24MB');
        input.value = '';
        return;
    }
    nameEl.textContent = file.name;
    preview.innerHTML = '';
    const url = URL.createObjectURL(file);
    if (file.type.startsWith('video/')) {
        const v = document.createElement('video');
        v.src = url; v.controls = true; v.muted = true; v.playsInline = true;
        preview.appendChild(v);
    } else {
        const img = document.createElement('img');
        img.src = url; img.alt = 'Preview';
        preview.appendChild(img);
    }
    preview.classList.add('show');
}

function validateStatusForm() {
    const content = (document.getElementById('statusContent').value || '').trim();
    const file = document.getElementById('statusFile');
    if (!content && !(file && file.files && file.files[0])) {
        alert('Andika maandishi au weka picha/video');
        return false;
    }
    return true;
}

function openStatusViewer(userId) {
    buildStatusQueue();
    statusCurrentUserId = userId;
    statusQueuePos = statusUserQueue.indexOf(userId);
    if (statusQueuePos < 0) {
        statusUserQueue.push(userId);
        statusQueuePos = statusUserQueue.length - 1;
    }
    loadStatusUser(userId);
}

function loadStatusUser(userId) {
    statusCurrentUserId = userId;
    clearStatusTimers();
    statusPaused = false;
    fetch('/status/user/' + userId)
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!data.success || !data.items || !data.items.length) {
            // skip to next in queue
            goNextUserInQueue();
            return;
        }
        statusItems = data.items;
        statusIndex = 0;
        statusIsOwn = !!(statusItems[0] && statusItems[0].is_own);
        document.getElementById('statusViewer').classList.add('show');
        document.body.style.overflow = 'hidden';
        if (typeof kijijiPushOverlay === 'function') kijijiPushOverlay('status');
        // Status open → stop feed & reels so only status audio/video plays
        if (typeof pauseFeedAndReelsVideos === 'function') pauseFeedAndReelsVideos();
        else if (typeof pauseAllVideosExcept === 'function') pauseAllVideosExcept(null);
        markStatusRingSeen(userId);
        renderStatusSlide();
        bindStatusReplyPause();
    })
    .catch(function() {
        if (typeof showToast === 'function') showToast('Imeshindikana kupakia status', 'error');
    });
}

function goNextUserInQueue() {
    if (statusQueuePos < 0) { closeStatusViewer(); return; }
    statusQueuePos += 1;
    if (statusQueuePos >= statusUserQueue.length) {
        closeStatusViewer();
        return;
    }
    loadStatusUser(statusUserQueue[statusQueuePos]);
}

function goPrevUserInQueue() {
    if (statusQueuePos <= 0) {
        // restart first slide of current
        statusIndex = 0;
        renderStatusSlide();
        return;
    }
    statusQueuePos -= 1;
    loadStatusUser(statusUserQueue[statusQueuePos]);
}

function stopStatusMusic() {
    try {
        var a = document.getElementById('statusBgMusic');
        if (a) { a.pause(); a.removeAttribute('src'); a.load(); a.remove(); }
    } catch (e) {}
}

function playStatusMusic(path) {
    stopStatusMusic();
    if (!path) return;
    var a = document.createElement('audio');
    a.id = 'statusBgMusic';
    a.src = '/static/' + path;
    a.loop = true;
    a.volume = 0.7;
    a.setAttribute('playsinline', '');
    document.body.appendChild(a);
    a.play().catch(function(){});
}

/* Preview muziki wakati wa kuchagua kwenye create status */
var _statusMusicPreview = null;
function previewStatusMusic(radio) {
    try {
        if (_statusMusicPreview) {
            _statusMusicPreview.pause();
            _statusMusicPreview.removeAttribute('src');
            _statusMusicPreview.load();
            _statusMusicPreview = null;
        }
    } catch (e) {}
    var path = radio && radio.value ? radio.value : '';
    if (!path) return;
    var a = document.createElement('audio');
    a.src = '/static/' + path;
    a.volume = 0.65;
    a.setAttribute('playsinline', '');
    _statusMusicPreview = a;
    a.play().catch(function(){});
    setTimeout(function() {
        if (_statusMusicPreview === a) {
            try { a.pause(); a.removeAttribute('src'); } catch (e) {}
            _statusMusicPreview = null;
        }
    }, 8000);
}

function spawnFloatingReactions(emojis) {
    var body = document.getElementById('statusViewerBody');
    if (!body || !emojis || !emojis.length) return;
    // clear old floats
    body.querySelectorAll('.status-float-emoji').forEach(function(el) { el.remove(); });
    emojis.slice(0, 12).forEach(function(em, i) {
        setTimeout(function() {
            var span = document.createElement('span');
            span.className = 'status-float-emoji';
            span.textContent = em;
            span.style.cssText = 'position:absolute;bottom:80px;left:' + (10 + Math.random() * 70) + '%;font-size:' + (22 + Math.random() * 14) + 'px;opacity:0.95;pointer-events:none;z-index:20;animation:statusFloatUp 2.8s ease-out forwards;';
            body.appendChild(span);
            setTimeout(function() { try { span.remove(); } catch(e){} }, 3000);
        }, i * 220);
    });
}

function __closeStatusViewerUI() {
    clearStatusTimers();
    stopStatusMusic();
    statusItems = [];
    statusIndex = 0;
    statusPaused = false;
    statusIsOwn = false;
    const body = document.getElementById('statusViewerBody');
    if (body) {
        const taps = body.querySelectorAll('.status-tap-left, .status-tap-right');
        body.innerHTML = '';
        taps.forEach(function(t) { body.appendChild(t); });
    }
    var sv = document.getElementById('statusViewer');
    if (sv) sv.classList.remove('show');
    var bar = document.getElementById('statusBottomBar');
    if (bar) bar.classList.remove('own-status');
    document.body.style.overflow = '';
    closeStatusViewers();
}
function closeStatusViewer(fromHistory) {
    __closeStatusViewerUI();
    if (!fromHistory) {
      var idx = (window.__kijijiOverlayStack || []).lastIndexOf('status');
      if (idx >= 0) {
        window.__kijijiOverlayStack.splice(idx, 1);
        try { if (history.state && history.state.kijijiOverlay === 'status') history.back(); } catch (e) {}
      }
    }
}

function clearStatusTimers() {
    clearTimeout(statusTimer);
    clearInterval(statusProgressTimer);
    statusTimer = null;
    statusProgressTimer = null;
}

function renderStatusSlide() {
    clearStatusTimers();
    stopStatusMusic();
    statusPaused = false;
    const item = statusItems[statusIndex];
    if (!item) { statusNext(); return; }

    // Rekodi view kila mara (backend inakataa self-view)
    fetch('/status/view/' + item.id, {
        method: 'POST',
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    }).then(function(r) { return r.json(); }).then(function(data) {
        if (data && typeof data.views_count === 'number') {
            item.views_count = data.views_count;
            var vc = document.getElementById('statusViewsCount');
            if (vc && (item.is_own || statusIsOwn)) vc.textContent = data.views_count;
        }
    }).catch(function(){});

    // Background music
    if (item.music_path) {
        playStatusMusic(item.music_path);
    }

    const avatar = document.getElementById('statusViewerAvatar');
    const nameEl = document.getElementById('statusViewerName');
    const timeEl = document.getElementById('statusViewerTime');
    const body = document.getElementById('statusViewerBody');
    const caption = document.getElementById('statusViewerCaption');
    const progressRow = document.getElementById('statusProgressRow');
    const viewersBtn = document.getElementById('statusViewersBtn');
    const replyRow = document.getElementById('statusReplyRow');
    const reactRow = document.getElementById('statusReactRow');

    if (avatar) {
        avatar.src = avatarSrc(item.profile_pic, item.full_name || item.username);
    }
    if (nameEl) {
        nameEl.textContent = item.full_name || item.username || 'User';
    }
    var profileLink = document.getElementById('statusViewerProfileLink');
    if (profileLink) {
        var uname = item.username || '';
        profileLink.href = uname ? ('/profile/' + encodeURIComponent(uname)) : '#';
        profileLink.onclick = function(e) {
            if (!uname) { e.preventDefault(); }
        };
    }
    if (timeEl) {
        timeEl.textContent = (typeof timeAgo === 'function' && item.created_at)
            ? timeAgo(item.created_at)
            : (item.created_at || '');
    }

    // progress segments
    progressRow.innerHTML = '';
    for (let i = 0; i < statusItems.length; i++) {
        const seg = document.createElement('div');
        seg.className = 'status-progress-seg';
        const fill = document.createElement('div');
        fill.className = 'fill';
        if (i < statusIndex) fill.style.width = '100%';
        else if (i === statusIndex) { fill.id = 'statusActiveFill'; fill.style.width = '0%'; }
        else fill.style.width = '0%';
        seg.appendChild(fill);
        progressRow.appendChild(seg);
    }

    // keep tap zones, clear media
    const left = document.getElementById('statusTapLeft');
    const right = document.getElementById('statusTapRight');
    body.innerHTML = '';
    if (left) body.appendChild(left);
    if (right) body.appendChild(right);
    let hint = document.getElementById('statusPausedHint');
    if (!hint) {
        hint = document.createElement('div');
        hint.id = 'statusPausedHint';
        hint.className = 'status-paused-hint';
        hint.textContent = 'Iliyositishwa';
        body.appendChild(hint);
    } else body.appendChild(hint);

    caption.textContent = item.content || '';

    // ===== UI: wengine = react + reply; mmiliki = viewers tu =====
    // Tumia ID pekee (si is_own kutoka API) ili isichanganyike
    (function applyStatusBottomUI() {
        var myId = (typeof MY_USER_ID !== 'undefined') ? String(MY_USER_ID) : '0';
        var ownerId = (item.user_id != null) ? String(item.user_id) : '';
        statusIsOwn = (myId !== '0' && ownerId !== '' && ownerId === myId);
        item.is_own = statusIsOwn;

        var bar = document.getElementById('statusBottomBar');
        if (bar) {
            bar.style.setProperty('display', 'flex', 'important');
            bar.style.setProperty('visibility', 'visible', 'important');
            bar.style.setProperty('opacity', '1', 'important');
            if (statusIsOwn) {
                bar.classList.add('own-status');
            } else {
                bar.classList.remove('own-status');
            }
        }

        if (statusIsOwn) {
            var vc = document.getElementById('statusViewsCount');
            if (vc) vc.textContent = item.views_count || 0;
            if (item.recent_reactions && item.recent_reactions.length) {
                spawnFloatingReactions(item.recent_reactions);
            }
        } else {
            document.querySelectorAll('.status-react-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-emoji') === item.my_reaction);
            });
            var inp = document.getElementById('statusReplyInput');
            if (inp) inp.value = '';
        }
    })();

    if (item.media_type === 'image' && item.file_path) {
        const img = document.createElement('img');
        img.src = STATUS_UPLOAD_BASE + item.file_path;
        img.alt = 'Status';
        body.insertBefore(img, left || null);
        var imgDur = item.music_path ? STATUS_DURATION_MUSIC : STATUS_DURATION;
        startStatusProgress(imgDur);
    } else if (item.media_type === 'video' && item.file_path) {
        const v = document.createElement('video');
        v.src = STATUS_UPLOAD_BASE + item.file_path;
        v.autoplay = true;
        v.playsInline = true;
        v.controls = false;
        v.id = 'statusActiveVideo';
        if (typeof pauseAllVideosExcept === 'function') pauseAllVideosExcept(v);
        body.insertBefore(v, left || null);
        v.onended = function() { if (!statusPaused) statusNext(); };
        v.onloadedmetadata = function() {
            const dur = Math.max(3000, Math.min((v.duration || 15) * 1000, STATUS_DURATION_VIDEO));
            startStatusProgress(dur);
        };
        setTimeout(function() {
            const fill = document.getElementById('statusActiveFill');
            if (fill && fill.style.width === '0%' && !statusPaused) startStatusProgress(STATUS_DURATION_VIDEO);
        }, 1500);
    } else {
        const t = document.createElement('div');
        t.className = 'status-viewer-text-only';
        t.textContent = item.content || '';
        body.insertBefore(t, left || null);
        caption.textContent = '';
        var textDur = item.music_path ? STATUS_DURATION_MUSIC : STATUS_DURATION;
        startStatusProgress(textDur);
    }
}

function startStatusProgress(durationMs) {
    statusProgressDuration = durationMs;
    statusProgressElapsed = 0;
    statusProgressStart = Date.now();
    statusPaused = false;
    const fill = document.getElementById('statusActiveFill');
    if (!fill) return;
    fill.style.width = '0%';
    clearStatusTimers();
    statusProgressTimer = setInterval(function() {
        if (statusPaused) return;
        const p = Math.min(100, ((Date.now() - statusProgressStart) / statusProgressDuration) * 100);
        fill.style.width = p + '%';
        if (p >= 100) clearInterval(statusProgressTimer);
    }, 40);
    statusTimer = setTimeout(function() {
        if (!statusPaused) statusNext();
    }, durationMs);
}

function pauseStatus() {
    if (statusPaused) return;
    statusPaused = true;
    statusProgressElapsed = Date.now() - statusProgressStart;
    clearTimeout(statusTimer);
    clearInterval(statusProgressTimer);
    const v = document.getElementById('statusActiveVideo');
    if (v) try { v.pause(); } catch(e) {}
    try { var a = document.getElementById('statusBgMusic'); if (a) a.pause(); } catch(e) {}
    const hint = document.getElementById('statusPausedHint');
    if (hint) hint.classList.add('show');
}

function resumeStatus() {
    if (!statusPaused) return;
    if (statusReplying) return; // bado anaandika reply
    statusPaused = false;
    try { var a = document.getElementById('statusBgMusic'); if (a) a.play().catch(function(){}); } catch(e) {}
    const hint = document.getElementById('statusPausedHint');
    if (hint) hint.classList.remove('show');
    const remaining = Math.max(200, statusProgressDuration - statusProgressElapsed);
    statusProgressStart = Date.now() - statusProgressElapsed;
    const fill = document.getElementById('statusActiveFill');
    clearInterval(statusProgressTimer);
    statusProgressTimer = setInterval(function() {
        if (statusPaused) return;
        const p = Math.min(100, ((Date.now() - statusProgressStart) / statusProgressDuration) * 100);
        if (fill) fill.style.width = p + '%';
        if (p >= 100) clearInterval(statusProgressTimer);
    }, 40);
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function() {
        if (!statusPaused) statusNext();
    }, remaining);
    const v = document.getElementById('statusActiveVideo');
    if (v) try { v.play(); } catch(e) {}
}

function bindStatusHoldPause() {
    const body = document.getElementById('statusViewerBody');
    if (!body || body.dataset.holdBound === '1') return;
    body.dataset.holdBound = '1';
    let holdTimer = null;
    let holding = false;
    function startHold(e) {
        if (e.target.closest('.status-bottom-bar')) return;
        holdTimer = setTimeout(function() {
            holding = true;
            pauseStatus();
        }, 180);
    }
    function endHold() {
        clearTimeout(holdTimer);
        if (holding) {
            holding = false;
            resumeStatus();
        }
    }
    body.addEventListener('touchstart', startHold, { passive: true });
    body.addEventListener('touchend', endHold);
    body.addEventListener('touchcancel', endHold);
    body.addEventListener('mousedown', startHold);
    body.addEventListener('mouseup', endHold);
    body.addEventListener('mouseleave', endHold);

    const left = document.getElementById('statusTapLeft');
    const right = document.getElementById('statusTapRight');
    if (left) left.onclick = function(e) { e.stopPropagation(); statusPrev(); };
    if (right) right.onclick = function(e) { e.stopPropagation(); statusNext(); };
}

function statusNext() {
    statusIndex += 1;
    if (statusIndex >= statusItems.length) {
        goNextUserInQueue();
    } else {
        renderStatusSlide();
    }
}
function statusPrev() {
    if (statusIndex <= 0) {
        goPrevUserInQueue();
        return;
    }
    statusIndex -= 1;
    renderStatusSlide();
}

function statusReact(emoji) {
    const item = statusItems[statusIndex];
    if (!item) return;
    // Double-check own status (usijireact)
    if (item.is_own || statusIsOwn) return;
    if (String(item.user_id) === String(MY_USER_ID) && String(MY_USER_ID) !== '0') return;
    const same = item.my_reaction === emoji;
    fetch('/status/react/' + item.id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reaction: same ? '' : emoji })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!data.success) {
            if (typeof showToast === 'function') showToast(data.error || 'Imeshindikana', 'error');
            return;
        }
        item.my_reaction = data.reaction;
        document.querySelectorAll('.status-react-btn').forEach(function(b) {

function bindStatusReplyPause() {
    const input = document.getElementById('statusReplyInput');
    if (!input || statusReplyPauseBound) return;
    statusReplyPauseBound = true;

    input.addEventListener('focus', function() {
        statusReplying = true;
        pauseStatus();
    });

    // Usifungue pause kwa blur — subiri send (kama user alidai)
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {

        }
    });

function statusSendReply() {
    const item = statusItems[statusIndex];
    if (!item) return;
    // Usijijibu status yako mwenyewe
    if (item.is_own || statusIsOwn) return;
    if (String(item.user_id) === String(MY_USER_ID) && String(MY_USER_ID) !== '0') return;
    const input = document.getElementById('statusReplyInput');
    if (!input) return;
    const text = (input.value || '').trim();
    if (!text) return;
    // Keep paused while sending
    statusReplying = true;
    pauseStatus();
    const sendBtn = document.querySelector('.status-reply-send');
    if (sendBtn) sendBtn.disabled = true;
    // Futa input mapema ili user aone feedback (kama WhatsApp)
    const sentText = text;
    input.value = '';
    fetch('/status/reply/' + item.id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
        body: JSON.stringify({ message: sentText })
    })
    .then(function(r) {
        return r.json().then(function(data) {
            return { ok: r.ok, status: r.status, data: data || {} };
        }).catch(function() {
            return { ok: r.ok, status: r.status, data: {} };
        });
    })
    .then(function(res) {
        if (sendBtn) sendBtn.disabled = false;
        if (res.ok && res.data && res.data.success) {
            input.blur();
            statusReplying = false;
            if (typeof showToast === 'function') {
                showToast('Jibu limetumwa kwenye chat ✓', 'success');
            }
            resumeStatus();
        } else {
            // Rudisha ujumbe kwenye input kama hakujafanikiwa
            input.value = sentText;
            if (typeof showToast === 'function') {
                showToast((res.data && res.data.error) || 'Imeshindikana kutuma', 'error');
            }
        }
    })
    .catch(function() {
        if (sendBtn) sendBtn.disabled = false;
        input.value = sentText;
        if (typeof showToast === 'function') showToast('Tatizo la mtandao', 'error');
    });
}

function showMediaPreviewFromFile(file) {
    const fileNameDisplay = document.getElementById('file-name-display');
    const previewBox = document.getElementById('media-preview');
    const previewContent = document.getElementById('media-preview-content');
    if (!file || !previewBox || !previewContent) return;

    if (fileNameDisplay) fileNameDisplay.textContent = file.name;
    previewContent.innerHTML = '';
    previewBox.style.background = '';

    const url = URL.createObjectURL(file);
    if (file.type.startsWith('video/')) {
        const v = document.createElement('video');
        v.src = url;
        v.controls = true;
        v.muted = true;
        v.playsInline = true;
        previewContent.appendChild(v);
        previewBox.classList.add('show');
    } else if (file.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'Preview';
        previewContent.appendChild(img);
        previewBox.classList.add('show');
    } else {
        const doc = document.createElement('div');
        doc.className = 'media-doc-preview';
        doc.innerHTML = '<i class="fa-solid fa-file-lines"></i><span></span>';
        doc.querySelector('span').textContent = file.name;
        previewContent.appendChild(doc);
        previewBox.classList.add('show');
        previewBox.style.background = 'transparent';
    }
}

    if (fileNameDisplay) fileNameDisplay.textContent = '';
}

/* ===== Upload progress — real MB + minimize / maximize / cancel ===== */
var activeUploadXhr = null;
var uploadIsMinimized = false;

function formatMb(bytes) {
    if (!bytes || bytes < 0) return '0 MB';
    var mb = bytes / (1024 * 1024);
    if (mb < 0.1) {
        var kb = bytes / 1024;
        return (kb < 10 ? kb.toFixed(1) : Math.round(kb)) + ' KB';
    }
    return (mb < 10 ? mb.toFixed(2) : mb.toFixed(1)) + ' MB';
}

function showUploadProgress(totalBytes) {
    var ov = document.getElementById('uploadProgressOverlay');
    var bar = document.getElementById('uploadProgressBar');
    var pct = document.getElementById('uploadProgressPct');
    var title = document.getElementById('uploadProgressTitle');
    var msg = document.getElementById('uploadProgressMsg');
    var mbEl = document.getElementById('uploadProgressMb');
    var remainEl = document.getElementById('uploadProgressRemain');
    var btnMax = document.getElementById('uploadBtnMaximize');
    uploadIsMinimized = false;
    if (ov) {
        ov.classList.add('show');
        ov.classList.remove('minimized');
    }
    if (bar) bar.style.width = '0%';
    if (pct) pct.textContent = '0%';
    if (title) title.textContent = 'Inapakia chapisho...';
    if (msg) msg.textContent = 'Tafadhali subiri, usifunge ukurasa.';
    if (mbEl) mbEl.textContent = '0 MB / ' + formatMb(totalBytes || 0);
    if (remainEl) remainEl.textContent = totalBytes ? ('Zimesalia: ' + formatMb(totalBytes)) : 'Zimesalia: —';
    if (btnMax) btnMax.style.display = 'none';
    document.body.style.overflow = 'hidden';
}

function setUploadProgress(loaded, total, phase) {
    var bar = document.getElementById('uploadProgressBar');
    var pct = document.getElementById('uploadProgressPct');
    var mbEl = document.getElementById('uploadProgressMb');
    var remainEl = document.getElementById('uploadProgressRemain');
    var title = document.getElementById('uploadProgressTitle');
    var msg = document.getElementById('uploadProgressMsg');

    var p = 0;
    if (total > 0) {
        p = Math.max(0, Math.min(100, Math.round((loaded / total) * 100)));
    } else if (phase === 'saving') {
        p = 100;
    }

    if (bar) bar.style.width = p + '%';
    if (pct) pct.textContent = p + '%';
    if (mbEl) mbEl.textContent = formatMb(loaded) + ' / ' + formatMb(total);
    if (remainEl) {
        var left = Math.max(0, (total || 0) - (loaded || 0));
        remainEl.textContent = left > 0 ? ('Zimesalia: ' + formatMb(left)) : 'Zimesalia: 0 MB';
    }

    if (phase === 'saving' || p >= 100) {
        if (title) title.textContent = 'Karibia kumaliza...';
        if (msg) msg.textContent = 'Inahifadhi chapisho lako kwenye server.';
        if (remainEl) remainEl.textContent = 'Zimesalia: 0 MB';
    }
}

function minimizeUploadProgress() {
    var ov = document.getElementById('uploadProgressOverlay');
    var btnMax = document.getElementById('uploadBtnMaximize');
    if (!ov) return;
    ov.classList.add('minimized');
    uploadIsMinimized = true;
    document.body.style.overflow = ''; // app usable again
    if (btnMax) btnMax.style.display = 'inline-flex';
}

function maximizeUploadProgress() {
    var ov = document.getElementById('uploadProgressOverlay');
    var btnMax = document.getElementById('uploadBtnMaximize');
    if (!ov) return;
    ov.classList.remove('minimized');
    uploadIsMinimized = false;
    document.body.style.overflow = 'hidden';
    if (btnMax) btnMax.style.display = 'none';
}

function onUploadCardClick(e) {
    // When minimized, tapping the bar (not Cancel) expands it
    if (!uploadIsMinimized) return;
    if (e.target.closest && e.target.closest('button')) return;
    maximizeUploadProgress();
}

function cancelUpload() {
    if (activeUploadXhr) {
        try { activeUploadXhr.abort(); } catch (err) {}
        activeUploadXhr = null;
    }
    hideUploadProgress();
    var btn = document.getElementById('btnPostSubmit');
    if (btn) {
        btn.disabled = false;
        btn.style.opacity = '1';
    }
    if (typeof showToast === 'function') {
        showToast('Upload imefutwa', 'error');
    } else {
        // soft notice only
    }
}

function hideUploadProgress() {
    var ov = document.getElementById('uploadProgressOverlay');
    if (ov) {
        ov.classList.remove('show');
        ov.classList.remove('minimized');
    }
    uploadIsMinimized = false;
    document.body.style.overflow = '';
}

document.addEventListener('DOMContentLoaded', function() {
    var form = document.getElementById('createPostForm');
    if (!form) return;

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        var content = (form.querySelector('textarea[name="content"]') || {}).value || '';
        var fileInput = document.getElementById('file');
        var hasFile = fileInput && fileInput.files && fileInput.files.length > 0;
        if (!content.trim() && !hasFile) {
            alert('Andika kitu au ongeza media kabla ya kuchapisha!');
            return;
        }

        var btn = document.getElementById('btnPostSubmit');
        if (btn) {
            btn.disabled = true;
            btn.style.opacity = '0.7';
        }

        var fd = new FormData(form);
        var totalBytes = 0;
        if (hasFile) {
            fd.set('file', fileInput.files[0], fileInput.files[0].name);
            totalBytes = fileInput.files[0].size || 0;
        }
        try {
            var textPart = (content || '').length;
            totalBytes = totalBytes + textPart + 256;
        } catch (err) {}

        showUploadProgress(totalBytes);

        var xhr = new XMLHttpRequest();
        activeUploadXhr = xhr;
        xhr.open('POST', form.action || '/create_post', true);
        xhr.withCredentials = true;

        xhr.upload.onprogress = function(ev) {
            if (ev.lengthComputable && ev.total > 0) {
                setUploadProgress(ev.loaded, ev.total, 'uploading');
            } else if (totalBytes > 0) {
                setUploadProgress(Math.min(ev.loaded || 0, totalBytes), totalBytes, 'uploading');
            }
        };

        xhr.upload.onload = function() {
            setUploadProgress(totalBytes || 1, totalBytes || 1, 'saving');
        };

        xhr.onreadystatechange = function() {
            if (xhr.readyState !== 4) return;
            if (xhr.status === 0) {
                // aborted
                activeUploadXhr = null;
                return;
            }
            setUploadProgress(totalBytes || 1, totalBytes || 1, 'saving');
            activeUploadXhr = null;
            if (xhr.status >= 200 && xhr.status < 400) {
                var loc = xhr.responseURL || '/home';
                setTimeout(function() {
                    window.location.href = loc.indexOf('/create_post') >= 0 ? '/home' : loc;
                }, 400);
            } else {
                hideUploadProgress();
                if (btn) {
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }
                alert('Imeshindikana kuchapisha. Jaribu tena.');
            }
        };

        xhr.onerror = function() {
            activeUploadXhr = null;
            hideUploadProgress();
            if (btn) {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
            alert('Tatizo la mtandao. Angalia connection yako.');
        };

        xhr.onabort = function() {
            activeUploadXhr = null;
            hideUploadProgress();
            if (btn) {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        };

        xhr.send(fd);
    });
});



/* ===== PHONE BACK BUTTON — funga overlay (si kuruka page) ===== */
window.__kijijiOverlayStack = window.__kijijiOverlayStack || [];
window.__kijijiHistoryLock = false;

function kijijiPushOverlay(name) {
  try {
    if (window.__kijijiHistoryLock) return;
    // avoid duplicate push for same top
    var stack = window.__kijijiOverlayStack;
    if (stack.length && stack[stack.length - 1] === name) return;
    stack.push(name);
    history.pushState({ kijijiOverlay: name, t: Date.now() }, '');
  } catch (e) {}
}

function kijijiPopOverlayName(name) {
  var stack = window.__kijijiOverlayStack || [];
  var idx = stack.lastIndexOf(name);
  if (idx >= 0) stack.splice(idx, 1);
}

function kijijiCloseFromHistory() {
  var stack = window.__kijijiOverlayStack || [];
  if (!stack.length) return false;
  var name = stack.pop();
  window.__kijijiHistoryLock = true;
  try {
    if (name === 'image') {
      if (typeof __closeImageLightboxUI === 'function') __closeImageLightboxUI();
    } else if (name === 'video') {
      if (typeof __closeVideoDetailUI === 'function') __closeVideoDetailUI();
    } else if (name === 'status') {
      if (typeof __closeStatusViewerUI === 'function') __closeStatusViewerUI();
    } else if (name === 'status-viewers') {
      if (typeof closeStatusViewers === 'function') closeStatusViewers();
    }
  } catch (e) {}
  window.__kijijiHistoryLock = false;
  return true;
}

if (!window.__kijijiPopstateBound) {
  window.__kijijiPopstateBound = true;
  window.addEventListener('popstate', function () {
    if (window.__kijijiOverlayStack && window.__kijijiOverlayStack.length) {
      kijijiCloseFromHistory();
    }
  });
}

    let userLiked = false;
    let content = '';

    // 1. From data attributes on image-container
    if (el && el.dataset) {
        username = el.dataset.username || '';
        profile = el.dataset.profile || '';
        likes = el.dataset.likes || '0';
        comments = el.dataset.comments || '0';
        userLiked = el.dataset.userLiked === '1' || el.dataset.userLiked === 'true';
        content = el.dataset.content || '';
    }

    // 2. Fallback from other image-container with same postId
    if ((!username || !content) && postId) {
        try {
            const containers = document.querySelectorAll('.image-container[data-post-id="' + postId + '"]');
            if (containers[0] && containers[0].dataset) {
                if (!username) username = containers[0].dataset.username || '';
                if (!profile) profile = containers[0].dataset.profile || '';
                if (likes === '0') likes = containers[0].dataset.likes || likes;
                if (comments === '0') comments = containers[0].dataset.comments || comments;
                if (!userLiked) userLiked = containers[0].dataset.userLiked === '1';
                if (!content) content = containers[0].dataset.content || '';
            }
        } catch (e) {}
    }

    // 3. Fallback from post card + live counts
    if (postId) {
        const card = document.getElementById('post-card-' + postId);
        if (card) {
            if (!username) {
                const nameLink = card.querySelector('.post-header-info strong a');
                if (nameLink) {
                    const href = nameLink.getAttribute('href') || '';
                    const m = href.match(/\/profile\/([^\/\?]+)/);
                    if (m) username = decodeURIComponent(m[1]);
                }
            }
            if (!content) {
                const pc = card.querySelector('.post-content');
                if (pc) content = (pc.textContent || '').trim();
            }
        }
        const likesEl = document.getElementById('likes-count-' + postId);
        const commentsEl = document.getElementById('comments-count-text-' + postId);
        if (likesEl) likes = (likesEl.textContent || '0').replace(/\D/g, '') || likes;
        if (commentsEl) comments = (commentsEl.textContent || '0').replace(/\D/g, '') || comments;
        const likeBtn = document.getElementById('like-btn-' + postId);
        if (likeBtn) userLiked = likeBtn.classList.contains('liked');
    }

    currentImageUsername = username;

    const avatar = document.getElementById('img-full-avatar');
    const nameEl = document.getElementById('img-full-username');
    const linkEl = document.getElementById('img-full-profile-link');
    if (nameEl) nameEl.textContent = username ? ('@' + username) : '@user';
    if (linkEl) {
        linkEl.href = username ? ('/profile/' + encodeURIComponent(username)) : '#';
        linkEl.onclick = function(e) {
            if (!username) { e.preventDefault(); }
        };
    }
    if (avatar) {
        avatar.src = avatarSrc(profile);
        avatar.onerror = function() { this.onerror = null; this.src = 'https://via.placeholder.com/40'; };
    }

    const likesOut = document.getElementById('img-full-likes');
    const commentsOut = document.getElementById('img-full-comments');
    if (likesOut) likesOut.textContent = likes;
    if (commentsOut) commentsOut.textContent = comments;

    const icon = document.getElementById('img-full-like-icon');
    if (icon) icon.style.color = userLiked ? '#ff2d55' : '#fff';

    const saveIcon = document.getElementById('img-full-save-icon');
    const saveText = document.getElementById('img-full-save-text');
    if (saveIcon) saveIcon.className = 'fa-regular fa-bookmark';
    if (saveText) saveText.textContent = 'Save';

    // Caption + See more (clean)
    const cap = document.getElementById('img-full-caption');
    if (cap) {
        cap.classList.remove('wlp-expandable', 'wlp-stage-0', 'wlp-stage-1', 'wlp-stage-2');
        cap.dataset.wlpReady = '';
        cap.dataset.seeMoreBound = '';
        let next = cap.nextElementSibling;
        while (next && (next.classList.contains('wlp-more-btn') || next.classList.contains('wlp-more-wrap'))) {
            const toRemove = next;
            next = next.nextElementSibling;
            toRemove.remove();
        }
        cap.textContent = content || '';
        cap.style.display = content ? '' : 'none';
        if (content && content.trim().length > 60) {
            bindImageCaptionSeeMore(cap);
        }
    }

    const drop = document.getElementById('img-full-dropdown');
    if (drop) drop.classList.remove('show');
}

    if (typeof window.__wlpMakeExpandable === 'function') {

/** Rudisha comments section kwenye feed IKIWA IMEEFICHWA (si open) */
function restoreFeedCommentsSection(section, placeholder) {
    if (section && placeholder && placeholder.parentNode) {
        placeholder.parentNode.insertBefore(section, placeholder);
        placeholder.remove();
    } else if (section && placeholder) {
        try { placeholder.remove(); } catch (e) {}
    }
    if (section) {
        section.classList.remove('active');
        section.style.display = ''; // ondoa inline block → CSS display:none inatumika
        section.style.removeProperty('display');
    }
}

function closeImageComments() {
    if (window._imgMovedSection) {
        restoreFeedCommentsSection(window._imgMovedSection, window._imgMovedPlaceholder);
        window._imgMovedSection = null;
        window._imgMovedPlaceholder = null;
    }
    const panel = document.getElementById('img-comment-panel');
    if (panel) panel.classList.remove('active');
    var list = document.getElementById('img-comments-list');
    if (list) list.innerHTML = '';
    var outerForm = document.getElementById('img-comment-form');
    if (outerForm) outerForm.style.display = 'none';
}

function imgFullComment() {
    if (!currentImagePostId) {
        if (typeof showToast === 'function') showToast('Post haipatikani', 'error');
        return;
    }

    // TOGGLE: kama panel tayari open → funga
    var panelCheck = document.getElementById('img-comment-panel');
    if (panelCheck && panelCheck.classList.contains('active')) {
        closeImageComments();
        return;
    }

    // Restore video-arena / image moved sections back to feed (hidden)
    if (window._vdaMovedSection) {
        restoreFeedCommentsSection(window._vdaMovedSection, window._vdaMovedPlaceholder);
        window._vdaMovedSection = null;
        window._vdaMovedPlaceholder = null;
    }
    if (window._imgMovedSection) {
        restoreFeedCommentsSection(window._imgMovedSection, window._imgMovedPlaceholder);
        window._imgMovedSection = null;
        window._imgMovedPlaceholder = null;
    }

    const panel = document.getElementById('img-comment-panel');
    const list = document.getElementById('img-comments-list');
    if (!panel || !list) return;

    list.innerHTML = '';
    panel.classList.add('active');

    var outerForm = document.getElementById('img-comment-form');
    if (outerForm) outerForm.style.display = 'none';

    const section = document.getElementById('comments-section-' + currentImagePostId);
    if (!section) {
        list.innerHTML = '<div style="text-align:center;padding:30px;color:#65676b;">Hakuna maoni bado. Kuwa wa kwanza!</div>';
        if (outerForm) outerForm.style.display = 'flex';
        return;
    }

    const placeholder = document.createElement('div');
    placeholder.id = 'img-placeholder-' + currentImagePostId;
    placeholder.style.display = 'none';
    section.parentNode.insertBefore(placeholder, section);
    list.appendChild(section);
    section.classList.add('active');
    section.style.display = 'block';

    window._imgMovedSection = section;
    window._imgMovedPlaceholder = placeholder;

    setTimeout(function() {
        list.querySelectorAll('.comment-item p, .reply-item p, .comment-item > p').forEach(function(el) {
            if (typeof window.__wlpCleanExpandable === 'function') window.__wlpCleanExpandable(el);
            if ((el.textContent || '').trim().length > 40 && typeof window.__wlpMakeExpandable === 'function') {
                window.__wlpMakeExpandable(el, true);
            }
        });
        // Hakikisha form ya feed inaonekana ndani, form ya nje imefichwa
        if (outerForm) outerForm.style.display = 'none';
        const input = list.querySelector('.comment-form input');
        if (input) input.focus();
    }, 100);
}

                </strong>

                    <span style="font-size: 11px; color: #65676b;">Sasa hivi</span>
                    <button class="comment-actions-btn" onclick="toggleCommentMenu(${cid})">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="comment-actions-dropdown" id="comment-menu-${cid}">

                </div>
            </div>

                <button onclick="likeComment(${cid})" style="background:none; border:none; cursor:pointer; font-weight: 600;" id="c-like-btn-${cid}">Like (<span id="c-likes-count-${cid}">0</span>)</button>
                <button onclick="showReplyBox(${cid})" style="background:none; border:none; cursor:pointer; color:inherit; font-weight: 600;">Reply</button>

            <div class="replies-list" style="margin-left: 12px; margin-top: 6px; border-left: 2px solid #e4e6eb; padding-left: 8px;" id="replies-list-${cid}"></div>
            <form class="reply-form" id="reply-form-${cid}" style="display: none; margin-top: 6px; margin-left: 12px;" onsubmit="addReply(event, ${postId}, ${cid})">

function addImageComment(event) {
    event.preventDefault();
    var input = document.getElementById('img-comment-input');
    var content = input ? input.value.trim() : '';
    if (!content || !currentImagePostId) return;

    var formData = new FormData();
    formData.append('content', content);

    fetch('/comment/' + currentImagePostId, { method: 'POST', body: formData })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (!data.success) {
            if (typeof showToast === 'function') showToast(data.message || 'Imeshindikana', 'error');
            return;
        }
        var html = buildFeedStyleCommentHtml(currentImagePostId, data.comment);
        var feedList = document.getElementById('comments-list-' + currentImagePostId);
        if (feedList) feedList.insertAdjacentHTML('beforeend', html);
        var list = document.getElementById('img-comments-list');
        if (list) {
            if (list.querySelector('div[style*="Hakuna"]')) list.innerHTML = '';
            list.insertAdjacentHTML('beforeend', html);
            list.scrollTop = list.scrollHeight;
        }
        if (input) input.value = '';
        var countEl = document.getElementById('img-full-comments');
        if (countEl) countEl.textContent = parseInt(countEl.textContent || '0', 10) + 1;
        var feedCount = document.getElementById('comments-count-text-' + currentImagePostId);
        if (feedCount) feedCount.textContent = parseInt(feedCount.textContent || '0', 10) + 1;
        if (typeof showToast === 'function') showToast((window.FEED_I18N&&FEED_I18N.comment_added)||'OK', 'success');
    })
    .catch(function() {
        if (typeof showToast === 'function') showToast((window.FEED_I18N&&FEED_I18N.error_occurred)||'Error', 'error');
    });
}

function followLinkup(linkupId, btnElement) {
    if (!linkupId) return;
    if (btnElement) btnElement.disabled = true;
    fetch('/linkup/' + linkupId + '/follow', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            'Accept': 'application/json'
        },
        credentials: 'same-origin'
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (!data || !data.success) {
            if (btnElement) btnElement.disabled = false;
            return;
        }
        var following = !!data.following;
        // Update follower counts: "N followers" mstari mmoja
        if (data.followers_count !== undefined) {
            document.querySelectorAll('.linkup-followers-count[data-linkup-id="' + linkupId + '"]').forEach(function(el) {
                el.textContent = data.followers_count + ' followers';
                el.style.whiteSpace = 'nowrap';
            });
        }
        // Baada ya follow: ficha "Following" kabisa (ondoa batani)
        document.querySelectorAll('button[data-linkup-id="' + linkupId + '"]').forEach(function(btn) {
            if (following) {
                btn.remove();
            } else {
                btn.disabled = false;
                btn.setAttribute('data-following', '0');
                btn.classList.remove('following');
                btn.innerHTML = '· Follow';
            }
        });
        // Kama unfollow kutoka sehemu nyingine na batani haipo, refresh si lazima
        if (typeof showToast === 'function') {
            showToast(following ? 'Umefollow Linkup' : 'Umeacha kufollow', 'success');
        }
    })
    .catch(function() {
        if (btnElement) btnElement.disabled = false;
    });
}

function followUser(targetUsername, btnElement, postId) {
    if (!targetUsername) return;
    if (btnElement) btnElement.disabled = true;
    fetch('/follow/' + encodeURIComponent(targetUsername), {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            'Accept': 'application/json'
        },
        body: JSON.stringify({ source_post_id: postId || null })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
        if (!data.success) {
            showToast(data.message || 'Imeshindikana kumfuata', 'error');
            if (btnElement) btnElement.disabled = false;
            return;
        }
        // Update all inline follow buttons for this user
        document.querySelectorAll('.btn-follow-inline').forEach(function(btn) {
            var u = btn.getAttribute('data-username') || '';
            var txt = (btn.textContent || '');
            var matches = (u && u === targetUsername) || txt.indexOf(targetUsername) >= 0;
            // also match by onclick username
            var oc = btn.getAttribute('onclick') || '';
            if (oc.indexOf("'" + targetUsername + "'") >= 0 || oc.indexOf('"' + targetUsername + '"') >= 0) matches = true;
            if (!matches && btn === btnElement) matches = true;
            if (!matches) return;
            if (data.following) {
                if (data.friends) {
                    var span = document.createElement('span');
                    span.className = 'friends-inline-badge';
                    span.title = 'Friends';
                    span.innerHTML = '<i class="fa-solid fa-user-group"></i> Friends';
                    btn.replaceWith(span);
                } else {
                    btn.remove();
                }
            }
        });
        // Hide menu follow buttons for this user
        document.querySelectorAll('.post-dropdown button').forEach(function(btn) {
            var oc = btn.getAttribute('onclick') || '';
            var t = (btn.textContent || '');
            if (oc.indexOf(targetUsername) >= 0 || t.indexOf('Follow') >= 0) {
                if (oc.indexOf(targetUsername) >= 0) btn.style.display = 'none';
            }
        });
        // Update video cards data
        document.querySelectorAll('[data-is-following]').forEach(function(el) {
            // no username attr always - skip
        });
        showToast(data.message || (data.friends ? 'Mmekuwa friends!' : 'Umeshamfollow!'), 'success');
    })
    .catch(function() {
        showToast((window.FEED_I18N&&FEED_I18N.error_occurred)||'Error', 'error');
        if (btnElement) btnElement.disabled = false;
    });
}

function setPostInterest(postId, actionType) {
    fetch(`/post_interest/${postId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: actionType })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            if (actionType === 'not_interested') {
                const card = document.getElementById(`post-card-${postId}`);
                if (card) {
                    card.style.transition = 'opacity 0.3s';
                    card.style.opacity = '0';
                    setTimeout(() => card.remove(), 300);
                }
                showToast('Post imeondolewa kwenye feed yako', 'success');
            } else {
                showToast('Asante! Tutakuonyesha machapisho yanayofanana.', 'success');
            }
        } else {
            showToast(data.message || 'Imeshindikana', 'error');
        }
    })
    .catch(() => showToast((window.FEED_I18N&&FEED_I18N.error_occurred)||'Error', 'error'));
}

let currentRepostId = null;

}

document.getElementById('confirmRepostBtn').addEventListener('click', function() {
    if (!currentRepostId) return;
    const btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    const capEl = document.getElementById('repostCaption');
    const caption = capEl ? capEl.value.trim() : '';
    fetch(`/repost/${currentRepostId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ caption: caption })
    })
    .then(res => res.json())
    .then(data => {
        btn.disabled = false;
        closeRepostConfirm();
        if (data.success) {
            showToast('Ume-repost kikamilifu!', 'success');
            setTimeout(() => location.reload(), 1000);
        } else {
            showToast(data.message || 'Imeshindikana ku-repost', 'error');
        }
    })
    .catch(() => {
        btn.disabled = false;

// ===== YOUTUBE-STYLE VIDEO PLAYER (WITH AUTOHIDE & SINGLE PLAY) =====
/** Pause every <video> except optional target (feed, reels, status, previews). */
function pauseAllVideosExcept(targetVideo) {
    document.querySelectorAll('video').forEach(function(v) {
        if (v === targetVideo) return;
        if (!v.paused) {
            try { v.pause(); } catch (e) {}
        }
        // Feed custom player UI
        var player = v.closest('.custom-video-player');
        if (player) {
            player.classList.remove('playing');
            var pId = player.id.replace('player-', '');
            var playIcon = document.getElementById('play-icon-' + pId);
            if (playIcon) playIcon.className = 'fa-solid fa-play';
        }
    });
}

/** Pause feed + reels only (keep status video playing). */
function pauseFeedAndReelsVideos() {
    document.querySelectorAll('.custom-video-player video, .reel-video').forEach(function(v) {
        if (!v.paused) {
            try { v.pause(); } catch (e) {}
        }
        var player = v.closest('.custom-video-player');
        if (player) {
            player.classList.remove('playing');
            var pId = player.id.replace('player-', '');
            var playIcon = document.getElementById('play-icon-' + pId);
            if (playIcon) playIcon.className = 'fa-solid fa-play';
        }
    });
}

function togglePlay(postId) {
    const player = document.getElementById(`player-${postId}`);
    if (!player) return;
    const video = player.querySelector('video');
    const playIcon = document.getElementById(`play-icon-${postId}`);

    if (video.paused) {
        // Close status if open — only one media source at a time
        var sv = document.getElementById('statusViewer');
        if (sv && sv.classList.contains('show') && typeof closeStatusViewer === 'function') {
            closeStatusViewer();
        }
        pauseAllVideosExcept(video);
        video.play().catch(() => {});
        player.classList.add('playing');
        if (playIcon) playIcon.className = 'fa-solid fa-pause';
        resetControlsTimeout(player);
    } else {
        video.pause();
        player.classList.remove('playing');
        if (playIcon) playIcon.className = 'fa-solid fa-play';
        player.classList.remove('hide-controls');
    }
}

function toggleMute(postId) {
    const video = document.querySelector(`#player-${postId} video`);
    const icon = document.getElementById(`mute-icon-${postId}`);
    video.muted = !video.muted;
    icon.className = video.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
}

function setVolume(e, postId) {
    const video = document.querySelector(`#player-${postId} video`);
    const slider = e.currentTarget;
    const rect = slider.getBoundingClientRect();
    const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    video.volume = percent;
    video.muted = percent === 0;
    const filledBar = document.getElementById(`volume-filled-${postId}`);
    if (filledBar) filledBar.style.width = (percent * 100) + '%';
    const icon = document.getElementById(`mute-icon-${postId}`);
    if (icon) icon.className = video.muted || percent === 0 ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
}

function toggleFullscreen(postId) {
    const player = document.getElementById(`player-${postId}`);
    if (!document.fullscreenElement) {
        player.requestFullscreen().catch(err => console.log(err));
    } else {
        document.exitFullscreen();
    }
}

let seeking = false;
function startSeek(e, postId) {
    e.preventDefault();
    seeking = true;
    const container = e.currentTarget;
    container.classList.add('dragging');
    seekVideo(e, postId);

    const moveHandler = (ev) => seekVideo(ev, postId);
    const upHandler = () => {
        seeking = false;
        container.classList.remove('dragging');
        document.removeEventListener('mousemove', moveHandler);
        document.removeEventListener('mouseup', upHandler);
        document.removeEventListener('touchmove', moveHandler);
        document.removeEventListener('touchend', upHandler);
    };
    document.addEventListener('mousemove', moveHandler);
    document.addEventListener('mouseup', upHandler);
    document.addEventListener('touchmove', moveHandler);
    document.addEventListener('touchend', upHandler);
}

function seekVideo(e, postId) {
    const video = document.querySelector(`#player-${postId} video`);
    const progressContainer = document.querySelector(`#player-${postId} .progress-container`);
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const rect = progressContainer.getBoundingClientRect();
    const percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    if (video.duration) {
        video.currentTime = percent * video.duration;
    }
}

function formatTime(seconds) {
    if (isNaN(seconds)) return '0:00';
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

// Controls Autohide Timer (3 Seconds)
const playerTimers = new Map();

function resetControlsTimeout(player) {
    const video = player.querySelector('video');
    player.classList.remove('hide-controls');

    if (playerTimers.has(player)) {
        clearTimeout(playerTimers.get(player));

        const timer = setTimeout(() => {
            player.classList.add('hide-controls');
        }, 3000); // Kujificha baada ya sekunde 3
        playerTimers.set(player, timer);
    }
}

var OFFLINE_CACHE_NAME = 'jamii-offline-videos';
var OFFLINE_INDEX_KEY = 'kijiji_offline_videos';

function getOfflineIndex() {
    try { return JSON.parse(localStorage.getItem(OFFLINE_INDEX_KEY) || '[]'); }
    catch (e) { return []; }
}
function setOfflineIndex(list) {
    try { localStorage.setItem(OFFLINE_INDEX_KEY, JSON.stringify(list || [])); } catch (e) {}
}
function isVideoOffline(src) {
    if (!src) return false;
    return getOfflineIndex().some(function (x) { return x.src === src; });
}
function updateVdaOfflineBtn() {
    var btn = document.getElementById('vda-download-btn');
    if (!btn) return;
    if (_vdaData && isVideoOffline(_vdaData.src)) {
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Imehifadhiwa';
        btn.style.opacity = '0.9';
    } else {
        btn.innerHTML = '<i class="fa-solid fa-download"></i> Offline';
        btn.style.opacity = '1';
    }
}

function formatBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
}

function showOvProgress(show, pct, text) {
    var w = document.getElementById('ovProgressWrap');
    var bar = document.getElementById('ovProgressBar');
    var t = document.getElementById('ovProgressText');
    if (!w) return;
    if (show) w.classList.add('show'); else w.classList.remove('show');
    if (bar) bar.style.width = (pct || 0) + '%';
    if (t && text) t.textContent = text;
}

async function vdaDownload() {
    if (!_vdaData || !_vdaData.src) return;
    var src = _vdaData.src;
    var btn = document.getElementById('vda-download-btn');

    // Tayari ipo → fungua orodha
    if (isVideoOffline(src)) {
        if (typeof showToast === 'function') showToast('Video tayari ipo offline', 'success');
        openOfflineVideos();
        return;
    }

    if (!navigator.onLine) {
        if (typeof showToast === 'function') showToast('Unahitaji mtandao kupakua video kamili', 'error');
        return;
    }

    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Inapakua...'; }
    showOvProgress(true, 5, 'Inaanza kupakua...');

    try {
        var res = await fetch(src, { credentials: 'same-origin' });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        var total = parseInt(res.headers.get('content-length') || '0', 10) || 0;
        var reader = res.body && res.body.getReader ? res.body.getReader() : null;
        var chunks = [];
        var received = 0;

        if (reader) {
            while (true) {
                var step = await reader.read();
                if (step.done) break;
                chunks.push(step.value);
                received += step.value.length;
                var pct = total ? Math.min(99, Math.round((received / total) * 100)) : Math.min(90, 10 + chunks.length);
                showOvProgress(true, pct, 'Inapakua... ' + pct + '%' + (total ? ' (' + formatBytes(received) + ')' : ''));
                if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + pct + '%';
            }
        } else {
            var buf = await res.arrayBuffer();
            chunks = [new Uint8Array(buf)];
            received = buf.byteLength;
            showOvProgress(true, 90, 'Inahifadhi...');
        }

        var blob = new Blob(chunks, { type: (res.headers.get('content-type') || 'video/mp4') });
        showOvProgress(true, 95, 'Inahifadhi kwenye simu...');

        var cache = await caches.open(OFFLINE_CACHE_NAME);
        await cache.put(src, new Response(blob, {
            status: 200,
            headers: {
                'Content-Type': blob.type || 'video/mp4',
                'Content-Length': String(blob.size)
            }
        }));

        // Also tell SW (optional)
        try {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'CACHE_MEDIA', url: src });
            }
        } catch (e) {}

        var list = getOfflineIndex().filter(function (x) { return x.src !== src; });
        list.unshift({
            postId: _vdaPostId,
            src: src,
            username: _vdaData.username || '',
            content: String(_vdaData.content || '').slice(0, 140),
            profile: _vdaData.profile || '',
            savedAt: Date.now(),
            size: blob.size
        });
        setOfflineIndex(list);

        showOvProgress(true, 100, 'Imekamilika ✓');
        setTimeout(function () { showOvProgress(false, 0, ''); }, 1200);
        if (typeof showToast === 'function') showToast('Video imehifadhiwa offline (' + formatBytes(blob.size) + ')', 'success');
        updateVdaOfflineBtn();
    } catch (err) {
        console.error('offline download', err);
        showOvProgress(false, 0, '');
        if (typeof showToast === 'function') showToast('Imeshindikana kupakua. Jaribu tena.', 'error');
        if (btn) btn.innerHTML = '<i class="fa-solid fa-download"></i> Offline';
    } finally {
        if (btn) btn.disabled = false;
        updateVdaOfflineBtn();
    }
}

function vdaLoadComments(postId) {

        restoreFeedCommentsSection(window._vdaMovedSection, window._vdaMovedPlaceholder);

    if (window._imgMovedSection) {
        restoreFeedCommentsSection(window._imgMovedSection, window._imgMovedPlaceholder);

        window._imgMovedPlaceholder = null;
    }

    host.innerHTML = '';
    var section = document.getElementById('comments-section-' + postId);
    if (!section) {
        host.innerHTML = '<div class="vda-comment-empty"><i class="fa-regular fa-user"></i> No comments yet. Be the first to comment!</div>';
        return;
    }

    // MOVE (si clone) — power kamili ya feed (reply, edit, delete, see more)
    var placeholder = document.createElement('div');
    placeholder.id = 'vda-placeholder-' + postId;
    placeholder.style.display = 'none';
    section.parentNode.insertBefore(placeholder, section);
    host.appendChild(section);
    section.classList.add('active');
    section.style.display = 'block';

    window._vdaMovedSection = section;
    window._vdaMovedPlaceholder = placeholder;

    setTimeout(function() {
        function forceOneLineSeeMore(el) {
            if (!el) return;
            var t = (el.textContent || '').replace(/\s+/g,' ').trim();
            if (t.length < 40) return;
            // strip old
            el.dataset.wlpReady = '';
            el.classList.remove('wlp-expandable','wlp-stage-0','wlp-stage-1','wlp-stage-2');
            var n = el.nextElementSibling;
            if (n && n.classList && n.classList.contains('wlp-more-wrap')) n.remove();
            if (typeof window.__wlpMakeExpandable === 'function') {
                window.__wlpMakeExpandable(el, true);
            }
            // ensure stage 0
            el.classList.add('wlp-expandable','wlp-stage-0');
            el.dataset.wlpStage = '0';
            el.style.display = '-webkit-box';
            el.style.webkitBoxOrient = 'vertical';
            el.style.webkitLineClamp = '1';
            el.style.overflow = 'hidden';
        }
        host.querySelectorAll('.comment-item > p, .comment-item p, .reply-item p').forEach(forceOneLineSeeMore);
        forceOneLineSeeMore(document.getElementById('vda-caption'));
    }, 100);
}

    document.querySelectorAll('.custom-video-player video').forEach(v => v.pause());
    // Close/pause status if open so reels is alone
    var sv = document.getElementById('statusViewer');
    if (sv && sv.classList.contains('show') && typeof closeStatusViewer === 'function') {
        closeStatusViewer();
    }
    if (typeof pauseAllVideosExcept === 'function') pauseAllVideosExcept(null);

    const sourceVideo = document.querySelector(`#player-${startPostId} video`);
    const currentPos = sourceVideo ? sourceVideo.currentTime : 0;

    collectVideos();
    if (reelsVideos.length === 0) return;

    const startIndex = reelsVideos.findIndex(v => String(v.id) === String(startPostId));
    currentReelIndex = startIndex >= 0 ? startIndex : 0;
    currentReelPostId = reelsVideos[currentReelIndex].id;

    if (reelsVideos[currentReelIndex]) {
        reelsVideos[currentReelIndex].currentTime = currentPos;
    }

    const container = document.getElementById('reels-container');
    container.innerHTML = '';

    reelsVideos.forEach((vid, idx) => {
        const slide = document.createElement('div');
        slide.className = 'reel-slide';
        slide.dataset.index = idx;
        slide.dataset.postId = vid.id;

        const defaultAvatar = "{{ url_for('static', filename='images/default-avatar.png.jfif') }}";
        const profileSrc = avatarSrc(vid.profile);

        slide.innerHTML = `
            <div class="reel-progress"><div class="reel-progress-filled" id="reel-progress-${idx}"></div></div>
            <video class="reel-video" src="${vid.src}" playsinline loop preload="metadata" data-start-time="${vid.currentTime}"></video>

            <div class="reel-side-actions">
                <div class="reel-action">
                    <img src="${profileSrc}" class="reel-profile" onerror="this.src='${defaultAvatar}'" onclick="window.open('/profile/${vid.username}', '_blank')">
                </div>
                <div class="reel-action" onclick="reelLike(${vid.id}, this)">
                    <button class="reel-action-btn ${vid.userLiked > 0 ? 'liked' : ''}">
                        <i class="fa-solid fa-heart"></i>
                    </button>
                    <span id="reel-likes-${vid.id}">${vid.likes}</span>
                </div>
                <div class="reel-action" onclick="openReelsComments(${vid.id})">
                    <button class="reel-action-btn"><i class="fa-solid fa-comment"></i></button>
                    <span id="reel-comments-count-${vid.id}">${vid.comments}</span>
                </div>
                <div class="reel-action" onclick="reelShare(${vid.id}, '${(vid.content || '').replace(/'/g, "\\'")}')">
                    <button class="reel-action-btn"><i class="fa-solid fa-share"></i></button>
                    <span id="reel-shares-${vid.id}">${vid.shares}</span>
                </div>
                <div class="reel-action" onclick="reelSave(${vid.id}, this)">
                    <button class="reel-action-btn"><i class="fa-regular fa-bookmark"></i></button>
                    <span id="reel-saved-${vid.id}">${vid.saved}</span>
                </div>
            </div>

            <div class="reel-bottom-info">
                <div class="reel-username">
                    <img src="${profileSrc}" class="reel-bottom-avatar" onerror="this.src='${defaultAvatar}'" onclick="window.location.href='/profile/${vid.username}'">
                    <a href="/profile/${vid.username}">@${vid.username}</a>
                    ${vid.verified == 1 ? '<i class="fa-solid fa-circle-check" style="color:#8A2BE2;font-size:14px;"></i>' : ''}
                    ${vid.isFollowing == 0 ? `<button class="reel-follow-btn" onclick="followUser('${vid.username}', this)">Follow</button>` : ''}
                </div>
                <div class="reel-caption">${vid.content || ''}</div>
            </div>
        `;
        container.appendChild(slide);

        const videoEl = slide.querySelector('.reel-video');
        videoEl.addEventListener('click', function(e) {
            e.stopPropagation();
            if (this.paused) {
                this.play();
            } else {
                this.pause();
            }
        });
    });

    document.getElementById('reels-viewer').classList.add('active');
    document.body.style.overflow = 'hidden';
    setOverlayMode(true);
    setTimeout(function() {
        document.querySelectorAll('#reels-container .reel-caption').forEach(bindOverlaySeeMore);
    }, 50);

    const target = container.children[currentReelIndex];
    if (target) {
        target.scrollIntoView({ behavior: 'instant', block: 'start' });
    }

    playCurrentReel();

    setTimeout(() => {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                const idx = parseInt(entry.target.dataset.index);
                if (entry.isIntersecting && entry.intersectionRatio > 0.7) {
                    currentReelIndex = idx;
                    currentReelPostId = entry.target.dataset.postId;
                    playCurrentReel();
                } else {
                    video.pause();
                }
            });
        }, { threshold: 0.7 });

        container.querySelectorAll('.reel-slide').forEach(slide => observer.observe(slide));
    }, 100);
}

function playCurrentReel() {
    const slides = document.querySelectorAll('.reel-slide');
    slides.forEach((slide, i) => {
        const video = slide.querySelector('video');
        if (i === currentReelIndex) {
            pauseAllVideosExcept(video);
            if (video.dataset.startTime !== undefined) {
                const st = parseFloat(video.dataset.startTime);
                if (!isNaN(st) && st > 0) {
                    video.currentTime = st;
                }
                delete video.dataset.startTime;
            }
            video.play().catch(() => {});
            video.muted = false;
            video.ontimeupdate = () => {
                if (video.duration) {
                    const pct = (video.currentTime / video.duration) * 100;
                    const bar = document.getElementById(`reel-progress-${i}`);
                    if (bar) bar.style.width = pct + '%';
                }
            };
        } else {
            video.pause();
        }
    });
}


function closeReels() {
    const activeSlide = document.querySelectorAll('.reel-slide')[currentReelIndex];
    if (activeSlide) {
        const reelVid = activeSlide.querySelector('video');
        if (reelVid && currentReelPostId) {
            const feedVid = document.querySelector(`#player-${currentReelPostId} video`);
            if (feedVid) {
                feedVid.currentTime = reelVid.currentTime;
            }
        }
    }

    document.getElementById('reels-viewer').classList.remove('active');
    document.body.style.overflow = '';
    setOverlayMode(false);
    closeReelsComments();
    document.querySelectorAll('.reel-video').forEach(v => {
        v.pause();
        v.src = '';
    });
    document.getElementById('reels-container').innerHTML = '';
}

function reelLike(postId, el) {
    fetch(`/like/${postId}`, { method: 'POST' })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            const btn = el.querySelector('.reel-action-btn');
            const count = document.getElementById(`reel-likes-${postId}`);
            count.textContent = data.likes_count;
            if (data.liked) {
                btn.classList.add('liked');
            } else {
                btn.classList.remove('liked');
            }
            const feedCount = document.getElementById(`likes-count-${postId}`);
            if (feedCount) feedCount.textContent = `${data.likes_count} Likes`;
            const feedBtn = document.getElementById(`like-btn-${postId}`);
            if (feedBtn) {
                data.liked ? feedBtn.classList.add('liked') : feedBtn.classList.remove('liked');
            }
        }
    });
}

function reelShare(postId, text) {
    fetch(`/share_post/${postId}`, { method: 'POST' })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            const shareCount = document.getElementById(`reel-shares-${postId}`);
            if (shareCount) shareCount.textContent = data.shares_count;
            const feedCount = document.getElementById(`share-count-text-${postId}`);
            if (feedCount) feedCount.textContent = data.shares_count;
        }
    });

    if (navigator.share) {
        navigator.share({ title: 'Kijiji Tanzania', text: text, url: window.location.href }).catch(() => {});
    } else {
        navigator.clipboard.writeText(window.location.href);
        showToast((window.FEED_I18N&&FEED_I18N.link_copied)||'Copied', 'success');
    }
}

function reelSave(postId, el) {
    fetch(`/save_post/${postId}`, { method: 'POST' })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            document.getElementById(`reel-saved-${postId}`).textContent = data.saved_count;
            const feedCount = document.getElementById(`saved-count-text-${postId}`);
            if (feedCount) feedCount.textContent = data.saved_count;
            showToast(data.saved ? ((window.FEED_I18N&&FEED_I18N.post_saved)||'Saved') : ((window.FEED_I18N&&FEED_I18N.post_unsaved)||'Removed'), 'success');
        }
    });
}
