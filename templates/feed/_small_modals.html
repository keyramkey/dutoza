<!-- Report Modal -->
<div class="custom-modal" id="reportModal">
    <div class="custom-modal-content">
        <h3>Why do you want to report this post?</h3>
        <input type="hidden" id="reportPostId">
        <button class="report-option" onclick="submitReport('Harmful')">1. Harmful</button>
        <button class="report-option" onclick="submitReport('Adult content')">2. Adult Content</button>
        <button class="report-option" onclick="submitReport('Sensitive')">3. Sensitive</button>
        <button class="report-option" onclick="submitReport('Not match my interest')">4. Not match my interest</button>
        <button class="report-option" onclick="submitReport('Awful')">5. Awful</button>
        <button onclick="closeReportModal()" style="margin-top: 10px; width: 100%; padding: 8px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer;">{{ t('cancel') }}</button>
    </div>
</div>

<!-- Repost Modal (caption + preview) -->
<div class="confirm-modal" id="repostConfirmModal">
    <div class="confirm-modal-content repost-modal">
        <h3>Repost</h3>
        <textarea id="repostCaption" class="repost-caption" rows="3" maxlength="1000"
                  placeholder="Andika caption yako hapa (si lazima)..."></textarea>
        <div class="repost-preview" id="repostPreview"></div>
        <div class="confirm-buttons">
            <button class="btn-confirm-no" onclick="closeRepostConfirm()">{{ t('cancel') }}</button>
            <button class="btn-confirm-yes" id="confirmRepostBtn">Repost</button>
        </div>
    </div>
</div>
